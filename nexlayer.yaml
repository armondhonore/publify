application:
  name: publify
  pods:
  - name: app
    image: ghcr.io/publify/publify:latest
    path: /
    servicePorts:
    - 3000
    vars:
      RAILS_ENV: production
      DATABASE_URL: "postgresql://publify:publify@postgres.pod:5432/publify"
      SECRET_KEY_BASE: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      RAILS_SERVE_STATIC_FILES: "true"
  - name: postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: publify
      POSTGRES_USER: publify
      POSTGRES_PASSWORD: publify
    volumes:
    - name: publify-db
      mountPath: /var/lib/postgresql/data
      size: 5Gi
